version: '3.9'

services:
  rapforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapforge-app
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=development
      - CDS_ENV=development
    volumes:
      # Mount source for live reload in dev
      - ./srv:/app/srv
      - ./db:/app/db
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4004/', r => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
